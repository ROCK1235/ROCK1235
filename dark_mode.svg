<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1280" height="850" font-size="16px">
<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
}
.key   {fill: #ffa657;}
.value {fill: #a5d6ff;}
.addColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.cc    {fill: #616e7f;}
.hdr   {fill: #c9d1d9; font-weight: bold;}
.ph    {fill: #6e7681; font-style: italic;}
text, tspan {white-space: pre;}
</style>

<rect width="1280" height="850" fill="#161b22" rx="15"/>

<!-- ===== ASCII art (left side, vertically centered) ===== -->
