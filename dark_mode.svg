  <tspan x="5" y="430">                @@@+=+**+=@@@@=              </tspan>
  <tspan x="5" y="450">                .@@@@*=*%@@@@#               </tspan>
  <tspan x="5" y="470">                 =@@@@@@@@@@%.%*             </tspan>
  <tspan x="5" y="490">                :+=*%@@@@@@=.*@@@+.          </tspan>
  <tspan x="5" y="510">              +--%+==*##+. .*@@@@@@@@#=      </tspan>
  <tspan x="5" y="530">          -@@@@:=#%+==:.   =@@@@@@@@@@@@@@%= </tspan>
  <tspan x="5" y="550">     .+@@@@@@@+-. :+:     :@@@@@@@@@@@@@@@@@@</tspan>
  <tspan x="5" y="570">  -@@@@@@@@@@@:          .@@@@@@@@@@@@@@@@@@@</tspan>
  <tspan x="5" y="590"> -@@@@@@@@@@@#           @@@@@@@@@@@@@@@@@@@@</tspan>
  <tspan x="5" y="610"> @@@@@@@@@@@@-          #@@@@@@@@@@@@@@@@@@@@</tspan>
